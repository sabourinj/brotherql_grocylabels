configuration:
  label_size:
    name: Label size
    description: Label identifier from brother_ql, e.g. 62x29 for die-cut or 62 for endless.
  printer_model:
    name: Printer model
    description: Printer model as brother_ql names it, e.g. QL-700 or QL-820NWB.
  printer_path:
    name: Printer path
    description: "file:///dev/usb/lp0 for USB, tcp://192.168.1.50 for network printers, or usb://0x04f9:0x2042 for raw USB."
  barcode_format:
    name: Barcode format
    description: Datamatrix fits small labels better, QRCode scans more easily.
  name_font:
    name: Name font
  name_font_size:
    name: Name font size
  name_max_lines:
    name: Name max lines
    description: Most lines the product name can use. Fewer are used on die-cut labels if the dates need the room.
  due_date_font:
    name: Date font
    description: Font for the due, purchased and opened dates.
  due_date_font_size:
    name: Date font size
  endless_margin:
    name: Endless label margin
    description: Top and bottom margin for endless labels.
  right_margin:
    name: Right margin
    description: Space in dots (about 12 per mm) kept between the text and the right edge of the label. Raise it if the dates run off the edge.
  purchased_date_prefix:
    name: Purchased date prefix
    description: Text printed before purchased_date. Leave blank to print the date on its own.
  opened_date_prefix:
    name: Opened date prefix
    description: Text printed before opened_date. Leave blank to print the date on its own.
  due_date_prefix:
    name: Due date prefix
    description: Replaces the "DD:" Grocy puts before the due date. Leave blank to print the date on its own.
  bold_dates:
    name: Bold dates
    description: Print the dates in bold, the prefixes before them stay regular.
  date_format:
    name: Date format
    description: "How the purchased, opened and due dates are printed, e.g. for 20 November 2026: 2026-11-20, 11/20/2026, 20/11/2026, 11/20/26, 20.11.2026, Nov 20, 2026 or 20 Nov 2026."
  grocy_url:
    name: Grocy URL
    description: "Optional. Grocy's address, e.g. http://192.168.1.10:9192. With an API key set, labels use the stock entry as Grocy saved it, so labels reprinted on opening get the opened date."
  grocy_api_key:
    name: Grocy API key
    description: Optional. Create one in Grocy under the user menu, Manage API keys.
  grocy_lookup_delay:
    name: Grocy lookup delay
    description: Seconds to wait for Grocy to save the stock entry before looking it up. Only used with a Grocy URL and API key.
network:
  8000/tcp: Label web service (Grocy webhook target)
